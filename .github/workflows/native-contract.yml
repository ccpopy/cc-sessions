name: Native contract

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  codex:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Build frontend assets for the Rust desktop target
        run: npm run build
      - name: Download pinned official native client
        shell: pwsh
        run: |
          $profile = Get-Content scripts/native-contract-profile.json -Raw | ConvertFrom-Json
          $binary = Join-Path $env:RUNNER_TEMP 'codex-contract.exe'
          Invoke-WebRequest $profile.codex.windows_asset -OutFile $binary
          if ((Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant() -ne $profile.codex.windows_sha256) {
            throw 'Native asset hash does not match the verified compatibility profile'
          }
          "CC_CONTRACT_BINARY=$binary" >> $env:GITHUB_ENV
      - name: Run native contract on isolated samples
        run: python -B scripts/run-native-contracts.py --codex "$env:CC_CONTRACT_BINARY" --output output/native-contract
      - name: Preserve structural result and unverified scope
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-contract-${{ github.sha }}
          path: output/native-contract/contract-summary.json
          if-no-files-found: error
          retention-days: 14
