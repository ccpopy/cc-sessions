name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            lsof

      - name: Install dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Check standalone CLI
        run: npm run cli:check

      - name: Check Claude offline move process guard
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --lib r04_idle_native_process -- --ignored --test-threads=1

      - name: Check all Rust targets
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

  windows:
    name: Windows checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Check standalone CLI
        run: npm run cli:check

      - name: Check all Rust targets
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

  claude-macos:
    name: macOS Claude move checks
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Claude moves with real child writers
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --lib claude_transfer

      - name: Check Claude offline move process guard
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --lib r04_idle_native_process -- --ignored --test-threads=1

  native:
    name: Pinned native contract
    uses: ./.github/workflows/native-contract.yml
