name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows
          - platform: macos-latest
            label: macos-arm64
          - platform: macos-15-intel
            label: macos-intel
          - platform: ubuntu-latest
            label: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $packageVersion = node -p "require('./package.json').version"
          $tauriVersion = node -p "require('./src-tauri/tauri.conf.json').version"
          $cargoLine = Select-String -Path "src-tauri/Cargo.toml" -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $cargoVersion = $cargoLine.Matches[0].Groups[1].Value

          if ($packageVersion -ne $tagVersion) {
            throw "package.json version $packageVersion does not match tag $tagVersion"
          }
          if ($tauriVersion -ne $tagVersion) {
            throw "tauri.conf.json version $tauriVersion does not match tag $tagVersion"
          }
          if ($cargoVersion -ne $tagVersion) {
            throw "Cargo.toml version $cargoVersion does not match tag $tagVersion"
          }

          $requiredIcons = @(
            "src-tauri/icons/32x32.png",
            "src-tauri/icons/128x128.png",
            "src-tauri/icons/128x128@2x.png",
            "src-tauri/icons/icon.ico",
            "src-tauri/icons/icon.icns"
          )
          foreach ($icon in $requiredIcons) {
            if (!(Test-Path $icon)) {
              throw "Missing required Tauri icon: $icon"
            }
            if ((Get-Item $icon).Length -le 0) {
              throw "Required Tauri icon is empty: $icon"
            }
          }

      - name: Build frontend
        run: npm run build

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CC Sessions ${{ github.ref_name }}
          releaseBody: |
            ## Changes

            ### 对话预览与时间线
            - Codex 对话按 commentary / final_answer 区分过程消息和最终答复；仅在相邻用户提问之间完全没有 Agent 活动时隐藏前一条提问。
            - 时间线导航使用相同过滤规则，同时保留会话末尾仍待处理的最新提问。
            - Claude 会话按原生 assistant、thinking 和 tool_use 内容判断 Agent 活动，不套用 Codex 的 agent_message 结构。
            - 会话列表优先同步官方标题，不再错误显示截断后的首条长消息。

            ### 预览交互
            - 新增“折叠过程”开关；开启时隐藏过程消息和折叠提示，关闭时可点击展开过程消息。
            - “仅看对话消息”和“折叠过程”默认开启，并在桌面端及 CLI WebUI 中跨重启持久化。
            - 复制会话 ID、复制 resume、打开目录、复制路径和编辑历史统一收进预览顶部的 `···` 菜单。

            ### 桌面应用
            - 增加单实例保护，再次运行同一程序时唤起并聚焦已有窗口。
            - 设置页支持下载、校验并自动安装 GitHub Release 更新；便携版原位替换，NSIS/MSI 安装版沿用当前安装目录。
            - 更新包会校验 Release 资产大小和 SHA-256，安装完成后自动重启应用。

            ### CLI WebUI
            - 同步本次对话预览、时间线和显示偏好调整。
            - CLI WebUI 检测到新版本时保留下载页面入口，不尝试替换桌面程序。
          releaseDraft: false
          prerelease: false

      - name: Create CLI package
        shell: pwsh
        run: node scripts/package-release.mjs --target cli --build-product

      - name: Upload CLI package
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $assets = @(Get-ChildItem -Path "release" -Filter "cc-sessions-cli-v$version-*.zip" -File)
          if ($assets.Count -ne 1) {
            throw "Expected exactly one CLI package for this job, found $($assets.Count)."
          }
          gh release upload "${{ github.ref_name }}" $assets[0].FullName --clobber

      - name: Create Windows portable executable
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: node scripts/package-release.mjs --target portable

      - name: Upload Windows portable packages
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $assets = @(
            "release/cc-session-manager-portable-v$version-windows.exe",
            "release/cc-session-manager-portable-v$version-windows.zip"
          )
          foreach ($asset in $assets) {
            if (!(Test-Path $asset)) {
              throw "Windows portable package was not found: $asset"
            }
          }
          gh release upload "${{ github.ref_name }}" $assets --clobber
