name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows
          - platform: macos-latest
            label: macos-arm64
          - platform: macos-15-intel
            label: macos-intel
          - platform: ubuntu-latest
            label: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $packageVersion = node -p "require('./package.json').version"
          $tauriVersion = node -p "require('./src-tauri/tauri.conf.json').version"
          $cargoLine = Select-String -Path "src-tauri/Cargo.toml" -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $cargoVersion = $cargoLine.Matches[0].Groups[1].Value

          if ($packageVersion -ne $tagVersion) {
            throw "package.json version $packageVersion does not match tag $tagVersion"
          }
          if ($tauriVersion -ne $tagVersion) {
            throw "tauri.conf.json version $tauriVersion does not match tag $tagVersion"
          }
          if ($cargoVersion -ne $tagVersion) {
            throw "Cargo.toml version $cargoVersion does not match tag $tagVersion"
          }

          $requiredIcons = @(
            "src-tauri/icons/32x32.png",
            "src-tauri/icons/128x128.png",
            "src-tauri/icons/128x128@2x.png",
            "src-tauri/icons/icon.ico",
            "src-tauri/icons/icon.icns"
          )
          foreach ($icon in $requiredIcons) {
            if (!(Test-Path $icon)) {
              throw "Missing required Tauri icon: $icon"
            }
            if ((Get-Item $icon).Length -le 0) {
              throw "Required Tauri icon is empty: $icon"
            }
          }

      - name: Build frontend
        run: npm run build

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CC Sessions ${{ github.ref_name }}
          releaseBody: |
            ## Changes

            ### 新增
            - 新增统一的桌面端异步命令调度层：60 个涉及文件、SQLite 或会话扫描的命令改由 Tauri blocking 线程池执行，界面线程只负责请求转发与结果展示。
            - 新增会话级 Provider 同步状态：执行时卡片显示“同步中…”和旋转图标，并禁用卡片标签及下拉菜单入口。
            - 新增同步任务注册表，单条同步与批量同步互斥，并能分别跟踪多个进行中的会话。

            ### 修复
            - 修复同步到当前 Provider、修复索引或执行诊断时阻塞 Tauri 主线程，导致窗口卡顿、无法切换页面或进度状态无法渲染的问题。
            - 修复重复点击“同步到 Provider”会重复发送后台请求，随后出现一次成功、一次 active 分支错误的问题。
            - 修复使用单一布尔状态时，一项同步先结束会错误清除其他仍在等待任务状态的问题。
            - 后台执行期间继续共享同一把 `FamilyLock`，保证会话克隆、分支同步、归档、删除和编辑仍按顺序修改 family 数据。

            ### 涉及模块
            - **会话**：列表、搜索、项目分组、归档与删除移出界面线程。
            - **修复**：Provider 单条/批量同步、分支合并、回滚与删除，以及项目配置、Codex 状态、会话索引、`threads` 表、孤儿记录和 Claude 可见性诊断/修复均改为后台执行。
            - **备份与传输**：备份创建、读取、校验、恢复、删除，以及 bundle 导入、导出、校验和 ZIP 打包/解包改为后台执行。
            - **预览与编辑**：会话预览、附件读取、消息编辑/删除/撤销、快照恢复和 Markdown 导出改为后台执行。
            - **统计**：KPI、时间序列、项目、模型与热力图统计改为后台执行。

            ### 验证
            - Rust 桌面端及无桌面 CLI 测试均为 145 项通过；Provider 同步与会话排序前端回归测试共 9 项通过。
            - TypeScript、Vite 生产构建、Windows release 构建及便携版启动冒烟测试通过。
          releaseDraft: false
          prerelease: false

      - name: Create CLI package
        shell: pwsh
        run: node scripts/package-release.mjs --target cli --build-product

      - name: Upload CLI package
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $assets = @(Get-ChildItem -Path "release" -Filter "cc-sessions-cli-v$version-*.zip" -File)
          if ($assets.Count -ne 1) {
            throw "Expected exactly one CLI package for this job, found $($assets.Count)."
          }
          gh release upload "${{ github.ref_name }}" $assets[0].FullName --clobber

      - name: Create Windows portable executable
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: node scripts/package-release.mjs --target portable

      - name: Upload Windows portable executable
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $asset = "release/cc-session-manager-portable-v$version-windows.exe"
          if (!(Test-Path $asset)) {
            throw "Windows portable executable was not found: $asset"
          }
          gh release upload "${{ github.ref_name }}" $asset --clobber
