name: Update Star history

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/update-star-history.mjs
      - scripts/update-star-history.test.mjs
      - .github/workflows/star-history.yml

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check chart generation
        run: node --test scripts/update-star-history.test.mjs

      - name: Refresh chart
        run: node scripts/update-star-history.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit updated chart
        run: |
          if git diff --quiet -- img/star-history.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- img/star-history.svg
          git diff --cached --check
          git commit -m "docs(readme): 更新 Star 历史图" -m "- 更新 GitHub Star 历史与当前数量"
          git pull --rebase origin main
          git push origin HEAD:main
